<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>New Tab</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 32px; padding-bottom: 12vh; box-sizing: border-box; }
  img { width: 272px; max-width: 60vw; user-select: none; -webkit-user-drag: none; }
  form { width: min(560px, 80vw); }
  input {
    width: 100%; box-sizing: border-box; height: 48px; padding: 0 18px;
    background: #0a0a0a; color: #e5383b; caret-color: #e5383b;
    border: 2px solid #5c1a1e; border-radius: 8px; outline: none;
    font: 16px "JetBrains Mono", monospace; text-align: center;
    transition: border-color .15s;
  }
  input:hover { border-color: #8a2a2e; }
  input:focus { border-color: #e5383b; }
  input::placeholder { color: #5c1a1e; }
  input::selection { background: #3a0d10; color: #ff4d4f; }
</style>
</head>
<body>
  <img src="google.png" alt="Google">
  <form action="https://www.google.com/search" method="get">
    <input name="q" placeholder="Search Google" autocomplete="off" autofocus>
  </form>
</body>
</html>
